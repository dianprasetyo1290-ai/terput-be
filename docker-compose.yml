# Root compose: boots all 6 sekoci microservices against ONE shared
# Postgres instance (6 separate databases, one per service — see
# db-init/init-multiple-dbs.sh) to keep operational/hosting cost low for a
# product sold per-school ("ketengan"). Each service still owns its own
# database/credentials/migrations — this is purely an infra consolidation,
# zero application code changes, since every service already just reads
# DATABASE_URL from env. See docs/CONVENTIONS.md.
#
# Postgres itself is NOT one of the services below — it runs off-compose on
# its own VM (POSTGRES_HOST/POSTGRES_PORT in .env). See the note above the
# `redis:` service for why, and don't add a local `postgres:` service back.
#
# All secrets/ports/db-names are parameterized via .env (loaded
# automatically by `docker compose` from this same directory) — nothing
# below is a hardcoded credential; see .env.example for the full list and
# defaults.
#
#   cp .env.example .env   # first time only
#   docker compose up -d --build
#   docker compose ps            # 6 migrate (exit 0) + 6 app containers + web
#   curl localhost:8081/healthz  # ... 8082 8083 8084 8085 8086
#
# Each service also keeps its own standalone services/<name>/docker-compose.yml
# (own throwaway postgres) for developing that one service in total isolation —
# unrelated to this file, left as-is.

services:
  # Postgres itself runs off-compose, on its own VM (sekoci-db-master,
  # POSTGRES_HOST in .env) -- ops moved it there for reliability separate
  # from app deploys/rebuilds. Every service below just points DATABASE_URL
  # at ${POSTGRES_HOST}:${POSTGRES_PORT}; see docker-compose.ydk13.yml for
  # the same pattern on the second tenant. Do not reintroduce a local
  # `postgres:` container here -- docker compose up would then construct a
  # brand-new empty volume and every service would silently start against
  # that instead of the real data (this happened once, 2026-09-01).

  # Response cache (client request 2026-08-29: "cache semua di redis"),
  # shared by all 6 services -- see each service's internal/cache package.
  # No volume: purely a cache, losing it on restart is fine (every service
  # fails open if this is ever unreachable, so it's not a startup dependency
  # either -- no depends_on wiring needed on the app services below).
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ---------- identity ----------
  identity-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/identity/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${IDENTITY_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  identity:
    build: ./services/identity
    restart: unless-stopped
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    environment:
      PORT: ${IDENTITY_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${IDENTITY_DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      EXAM_SERVICE_URL: http://exam:${EXAM_PORT}
      ACADEMIC_SERVICE_URL: http://academic:${ACADEMIC_PORT}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      CORE_URL: http://core:${CORE_PORT:-8091}
    ports: ["${IDENTITY_PORT}:${IDENTITY_PORT}"]

  # ---------- academic ----------
  academic-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/academic/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ACADEMIC_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  academic:
    build: ./services/academic
    restart: unless-stopped
    depends_on:
      academic-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
    environment:
      PORT: ${ACADEMIC_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ACADEMIC_DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_BASE_URL: http://identity:${IDENTITY_PORT}
      CORE_BASE_URL: http://core:${CORE_PORT:-8091}
      ACADEMIC_INTERNAL_URL: http://academic:${ACADEMIC_PORT}
    ports: ["${ACADEMIC_PORT}:${ACADEMIC_PORT}"]

  # ---------- attendance ----------
  attendance-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/attendance/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ATTENDANCE_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  attendance:
    build: ./services/attendance
    restart: unless-stopped
    depends_on:
      attendance-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
      academic:
        condition: service_started
    environment:
      PORT: ${ATTENDANCE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ATTENDANCE_DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_SERVICE_URL: http://identity:${IDENTITY_PORT}
      ACADEMIC_SERVICE_URL: http://academic:${ACADEMIC_PORT}
    ports: ["${ATTENDANCE_PORT}:${ATTENDANCE_PORT}"]

  # ---------- exam ----------
  exam-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/exam/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EXAM_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  exam:
    build: ./services/exam
    restart: unless-stopped
    depends_on:
      exam-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
      academic:
        condition: service_started
    environment:
      PORT: ${EXAM_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EXAM_DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_URL: http://identity:${IDENTITY_PORT}
      ACADEMIC_URL: http://academic:${ACADEMIC_PORT}
      # Token peserta applicant PPDB (jangan pakai JWT identity).
      EXAM_PARTICIPANT_SECRET: ${EXAM_PARTICIPANT_SECRET}
    ports: ["${EXAM_PORT}:${EXAM_PORT}"]

  # ---------- evaluation ----------
  evaluation-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/evaluation/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVALUATION_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  evaluation:
    build: ./services/evaluation
    restart: unless-stopped
    depends_on:
      evaluation-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
      academic:
        condition: service_started
    environment:
      PORT: ${EVALUATION_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${EVALUATION_DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_BASE_URL: http://identity:${IDENTITY_PORT}
      ACADEMIC_BASE_URL: http://academic:${ACADEMIC_PORT}
    ports: ["${EVALUATION_PORT}:${EVALUATION_PORT}"]

  # ---------- report ----------
  report-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/report/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${REPORT_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  report:
    build: ./services/report
    restart: unless-stopped
    depends_on:
      report-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
      academic:
        condition: service_started
      attendance:
        condition: service_started
      exam:
        condition: service_started
    environment:
      PORT: ${REPORT_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${REPORT_DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_SERVICE_URL: http://identity:${IDENTITY_PORT}
      ACADEMIC_SERVICE_URL: http://academic:${ACADEMIC_PORT}
      ATTENDANCE_SERVICE_URL: http://attendance:${ATTENDANCE_PORT}
      EXAM_SERVICE_URL: http://exam:${EXAM_PORT}
    ports: ["${REPORT_PORT}:${REPORT_PORT}"]

  # ---------- admission (Teratai PPDB) ----------
  admission-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/admission/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ADMISSION_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  admission:
    build: ./services/admission
    restart: unless-stopped
    depends_on:
      admission-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
      academic:
        condition: service_started
      exam:
        condition: service_started
    environment:
      PORT: ${ADMISSION_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${ADMISSION_DB_NAME}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      # Secret terpisah: sesi wali PPDB tidak boleh memakai JWT identity.
      ADMISSION_GUARDIAN_JWT_SECRET: ${ADMISSION_GUARDIAN_JWT_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-dev}
      STORAGE_ROOT: /data/private
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_URL: http://identity:${IDENTITY_PORT}
      ACADEMIC_URL: http://academic:${ACADEMIC_PORT}
      EXAM_URL: http://exam:${EXAM_PORT}
    volumes: ["admission_files:/data/private"]
    ports: ["8098:${ADMISSION_PORT}"]

  # ---------- notification (Teratai: notifikasi + chat portal) ----------
  notification-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/notification/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${NOTIFICATION_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  notification:
    build: ./services/notification
    restart: unless-stopped
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
    environment:
      PORT: ${NOTIFICATION_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${NOTIFICATION_DB_NAME}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-unconfigured}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_URL: http://identity:${IDENTITY_PORT}
    ports: ["${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"]

  # ---------- billing (Teratai: SPP / tagihan sekolah) ----------
  billing-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/billing/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${BILLING_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  billing:
    build: ./services/billing
    restart: unless-stopped
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
    environment:
      PORT: ${BILLING_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${BILLING_DB_NAME}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_URL: http://identity:${IDENTITY_PORT}
      ACADEMIC_URL: http://academic:${ACADEMIC_PORT}
      STORAGE_ROOT: /data/private
      CORE_URL: http://core:${CORE_PORT:-8091}
      BILLING_INTERNAL_URL: http://billing:${BILLING_PORT}
      NOTIFICATION_URL: http://notification:${NOTIFICATION_PORT}
      ACCOUNTING_URL: http://accounting:80
      GATEWAY_JOB_INTERVAL_SECONDS: ${GATEWAY_JOB_INTERVAL_SECONDS:-60}
    volumes: ["billing_files:/data/private"]
    ports: ["${BILLING_PORT}:${BILLING_PORT}"]

  # ---------- core (Approval Center, Exception Queue, Audit Trail) ----------
  core-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/core/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${CORE_DB_NAME}?sslmode=disable", "up"]
    restart: "no"

  core:
    build: ./services/core
    restart: unless-stopped
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
    environment:
      PORT: ${CORE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${CORE_DB_NAME}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_URL: http://identity:${IDENTITY_PORT}
      NOTIFICATION_URL: http://notification:${NOTIFICATION_PORT}
      HR_URL: http://hr:${HR_PORT}
    ports: ["${CORE_PORT}:${CORE_PORT}"]

  # ---------- hr (Teratai: HRIS & ESS) ----------
  hr-migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["./services/hr/migrations:/migrations"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${HR_DB_NAME:-teratai_hr}?sslmode=disable", "up"]
    restart: "no"

  hr:
    build: ./services/hr
    restart: unless-stopped
    depends_on:
      hr-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_started
    environment:
      PORT: ${HR_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${HR_DB_NAME:-teratai_hr}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      HR_ENC_KEY: ${HR_ENC_KEY}
      HR_BLIND_KEY: ${HR_BLIND_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      IDENTITY_URL: http://identity:${IDENTITY_PORT}
      CORE_URL: http://core:${CORE_PORT:-8091}
      NOTIFICATION_URL: http://notification:${NOTIFICATION_PORT}
      STORAGE_ROOT: /data/private
      HR_PUBLIC_INTERNAL_URL: http://hr:${HR_PORT}
    volumes: ["hr_files:/data/private"]
    ports: ["${HR_PORT}:${HR_PORT}"]

  # ---------- accounting ----------
  # Laravel, served under /accounting/ by `web` (see web/nginx.conf). No
  # accounting-migrate sidecar: its entrypoint migrates only the shared `public`
  # infrastructure tables, and each school's own schema is created by
  # `docker compose exec accounting php artisan accounting:provision <school_id>`
  # run deliberately per school -- NOT automatic on first SSO, because it seeds
  # baseline data. Until it runs, /sso answers 403 for that school.
  accounting:
    build: ./services/accounting
    restart: unless-stopped
    depends_on:
      # /sso verifies the Sekoci JWT and then asks identity whether this school
      # has the accounting feature switched on.
      identity:
        condition: service_started
    environment:
      APP_NAME: "${ACCOUNTING_APP_NAME:-Sekoci Accounting}"
      APP_ENV: "${ACCOUNTING_APP_ENV:-production}"
      APP_KEY: "${ACCOUNTING_APP_KEY:-change-me}"
      APP_DEBUG: "${ACCOUNTING_APP_DEBUG:-false}"
      APP_URL: "${ACCOUNTING_APP_URL:-https://app.sekoci.id/accounting}"
      DB_CONNECTION: pgsql
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_DATABASE: ${ACCOUNTING_DB_NAME:-skci_accounting}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DRIVER: database
      SESSION_PATH: /
      CACHE_STORE: database
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      # Served from a sub-path, so every asset()/url() must carry it.
      ASSET_URL: "${ACCOUNTING_ASSET_URL:-/accounting}"
      # SSO: verifies the Sekoci JWT (same secret as the 6 Go services) and
      # then asks identity, with the shared internal key, whether this school
      # may use accounting at all.
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      IDENTITY_SERVICE_URL: http://identity:${IDENTITY_PORT}
    ports: ["${ACCOUNTING_PORT:-8087}:80"]

  # ---------- web (frontend, nginx reverse-proxying /api/<service>/) ----------
  web:
    build:
      context: ./web
      args:
        VITE_BASE: ${VITE_BASE:-/}
    restart: unless-stopped
    depends_on:
      - identity
      - academic
      - attendance
      - exam
      - evaluation
      - report
      - accounting
      - admission
      - notification
      - billing
      - core
      - hr
    networks:
      - default
      - edge

volumes:
  admission_files:
  billing_files:
  hr_files:

networks:
  default:
  edge:
    external: true
