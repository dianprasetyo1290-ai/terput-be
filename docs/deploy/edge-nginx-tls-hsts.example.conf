# EXAMPLE ONLY (QA-IDN, BUG-005) -- edge nginx in front of the `web` container.
# Not used by any compose file. Apply manually on the edge host after review;
# steps are in docs/prd-sekoci/handoff/QA-IDN.md ("Konfigurasi server").
#
# Replace sekoci.example.id with the real host name and the upstream with the
# address edge-nginx already uses to reach `web` (on the shared box the app
# lives under /teratai/, keep that location as it is and only add the TLS +
# header lines).

# 1) Plain HTTP only redirects (and serves the ACME challenge).
server {
    listen 80;
    listen [::]:80;
    server_name sekoci.example.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sekoci.example.id;

    ssl_certificate     /etc/letsencrypt/live/sekoci.example.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sekoci.example.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Start with a short max-age (300) for a day, then raise to one year.
    # Add "; preload" only after every subdomain serves HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m; # same as web/nginx.conf

    location / {
        proxy_pass http://127.0.0.1:8080;   # <- the web container / current upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
