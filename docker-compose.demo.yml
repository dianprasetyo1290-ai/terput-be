# Demo box override: one dedicated VPS (2 vCPU / 2 GB) serving the app at the
# bare IP, http://<ip>/. Layered on top of the local override, which brings
# the Postgres container and the accounting stub:
#
#   docker compose -p terput -f docker-compose.yml -f docker-compose.local.yml \
#     -f docker-compose.demo.yml --env-file .env.demo up -d
#
# Only `web` (nginx: SPA + /api/* reverse proxy) is published, on port 80;
# every service and Postgres stay on the compose network. Memory limits keep
# the whole stack around 1.3 GB so the box does not swap during a demo.
# Images are built elsewhere and loaded on the box (scripts/deploy-demo.sh).
x-lim: &lim
  deploy: { resources: { limits: { memory: 128m, cpus: "0.5" } } }

services:
  redis: { deploy: { resources: { limits: { memory: 64m } } } }
  identity: { <<: *lim, ports: !reset [] }
  academic: { <<: *lim, ports: !reset [] }
  attendance: { <<: *lim, ports: !reset [] }
  exam: { <<: *lim, ports: !reset [] }
  evaluation: { <<: *lim, ports: !reset [] }
  report: { <<: *lim, ports: !reset [] }
  admission: { <<: *lim, ports: !reset [] }
  notification: { <<: *lim, ports: !reset [] }
  billing: { <<: *lim, ports: !reset [] }
  core: { <<: *lim, ports: !reset [] }
  hr: { <<: *lim, ports: !reset [] }
  ops: { <<: *lim, ports: !reset [] }
  studentlife: { <<: *lim, ports: !reset [] }
  quality: { <<: *lim, ports: !reset [] }
  insight: { <<: *lim, ports: !reset [] }
  accounting: { deploy: { resources: { limits: { memory: 32m } } } }
  postgres:
    ports: !reset []
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=200", "-c", "work_mem=4MB"]
    deploy: { resources: { limits: { memory: 640m } } }
  web:
    ports: ["80:80"]
    deploy: { resources: { limits: { memory: 64m } } }

networks:
  # The shared staging box attaches `web` to an external edge-nginx network;
  # here `web` is the edge itself.
  edge:
    external: false
