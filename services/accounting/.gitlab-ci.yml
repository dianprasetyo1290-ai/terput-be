stages:
  - build
  - deploy_dev

image: docker:26.1.3

services:
  - docker:26.1.3-dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  REGISTRY: registry.ti-asia.com
  PROJECT: exco
  APP_NAME: exco
  IMAGE_BASE: $REGISTRY/$PROJECT/$APP_NAME

.default_docker:
  tags:
    - tia-runner
  before_script:
    - docker info
    - echo "$HARBOR_PASSWORD" | docker login $REGISTRY -u "$HARBOR_USERNAME" --password-stdin

build_staging:
  extends: .default_docker
  stage: build
  only:
    - main
  script:
    - docker build --no-cache -t $APP_NAME:build .
    - docker tag $APP_NAME:build $IMAGE_BASE:latest
    - docker tag $APP_NAME:build $IMAGE_BASE:$CI_COMMIT_SHA
    - docker push $IMAGE_BASE:latest
    - docker push $IMAGE_BASE:$CI_COMMIT_SHA

deploystaging:
  stage: deploy_dev
  tags:
    - tia-runner
  when: manual
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/cicd
    - chmod 600 ~/.ssh/cicd
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/cicd
  script:
    - |
      ssh -o StrictHostKeyChecking=no root@"$IP_SERVER" << EOF
        cd /var/opt/exco
        docker compose pull
        docker compose up -d --force-recreate
      EOF