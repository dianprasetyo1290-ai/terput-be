services:
  billing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_HOST_PORT}:5432" # standalone dev host port; Teratai billing uses 5490
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      billing-db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@billing-db:5432/${DB_NAME}?sslmode=disable
      - up
    restart: "no"

  billing-service:
    build: .
    restart: unless-stopped
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@billing-db:5432/${DB_NAME}?sslmode=disable
      SEKOCI_JWT_SECRET: ${SEKOCI_JWT_SECRET}
      SEKOCI_INTERNAL_KEY: ${SEKOCI_INTERNAL_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      IDENTITY_URL: ${IDENTITY_URL}
      ACADEMIC_URL: ${ACADEMIC_URL}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/private}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
    volumes:
      - billing_files:/data/private
    ports:
      - "${PORT}:${PORT}"

volumes:
  billing_pgdata:
  billing_files:
